name: Bug report
description: Report a problem with quarto-ed
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the sections below.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened? What did you expect to happen instead?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Step-by-step instructions to reproduce the issue.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: App version / build
      description: >
        Shown in the bottom-right of the editor's Preview panel, e.g.
        "quarto-ed 0.1.0 (abc1234)". If you can't access the editor, check
        the response of /api/version on the deployment you were using.
      placeholder: "quarto-ed 0.1.0 (abc1234)"
    validations:
      required: true

  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Chrome / Chromium-based
        - Firefox
        - Safari
        - Other (specify in description)
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / screenshots
      description: Paste any error output from the browser console, the Logs panel, or attach screenshots.
      render: shell
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Anything else relevant (deployment type, the document you were editing, etc.)
    validations:
      required: false

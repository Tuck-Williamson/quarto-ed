name: Build, Test, and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  # ────────────────────────────────────────────────────────────────────────
  # JOB 1: Fast Static Security Scans (Runs in parallel with the build)
  # ────────────────────────────────────────────────────────────────────────
  static-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python with Cache
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Security Tools
        run: pip install pip-audit bandit

      - name: Security scan – pip-audit
        run: pip-audit -r requirements.txt

      - name: Security scan – bandit
        run: bandit -r app/ -c .bandit -ll

  # ────────────────────────────────────────────────────────────────────────
  # JOB 2: Build, Test, and Deploy
  # ────────────────────────────────────────────────────────────────────────
  build-test-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compute build metadata
        id: meta-vars
        run: |
          echo "SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)" >> $GITHUB_OUTPUT
          APP_VERSION=$(python3 -c "import re; print(re.search(r'__version__\s*=\s*[\"\x27]([^\"\x27]+)[\"\x27]', open('app/__init__.py').read()).group(1))")
          echo "APP_VERSION=$APP_VERSION" >> $GITHUB_OUTPUT

          LOWERS_IMAGE=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=$LOWERS_IMAGE" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: docker_meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.meta-vars.outputs.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
            type=raw,value=sha-${{ steps.meta-vars.outputs.SHORT_SHA }}
            type=raw,value=v${{ steps.meta-vars.outputs.APP_VERSION }},enable=${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
            type=ref,event=pr,prefix=pr-

      # Build the production image into the host daemon as app:ci.
      # Not pushed yet — tests and Trivy must pass first.
      - name: Build Production Image (local)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          push: false
          tags: app:ci
          labels: ${{ steps.docker_meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ steps.meta-vars.outputs.SHORT_SHA }}
          cache-from: type=gha,scope=prod
          cache-to: type=gha,mode=max,scope=prod

      # Plain docker build (not Buildx) so it can see the host daemon's app:ci.
      - name: Build Test Image
        run: docker build -f Dockerfile.test --build-arg BASE_IMAGE=app:ci -t app:test .

      # Fast suite always (default CMD; pass-2 non-root is skipped under CI).
      # On main-branch / PR-merge builds, additionally run the slow PDF suite in
      # a second container concurrently. Both must pass before the Trivy scan and
      # push/deploy steps below. PDF renders are excluded from PR builds for fast
      # feedback (pytest.ini's `-m "not pdf"`).
      - name: Run tests
        run: |
          docker run --rm -e CI app:test > fast.log 2>&1 &
          FAST_PID=$!
          PDF_PID=""
          if [ "${{ github.ref }}" = "refs/heads/main" ] && [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "main build → running PDF suite in parallel"
            docker run --rm -e RUN_PDF_TESTS=1 app:test \
              python3.11 -m pytest tests/ -m pdf --no-cov --tb=short -q > pdf.log 2>&1 &
            PDF_PID=$!
          fi
          wait "$FAST_PID"; RC_FAST=$?
          RC_PDF=0
          if [ -n "$PDF_PID" ]; then wait "$PDF_PID"; RC_PDF=$?; fi
          echo "::group::Fast suite output"; cat fast.log; echo "::endgroup::"
          if [ -f pdf.log ]; then echo "::group::PDF suite output"; cat pdf.log; echo "::endgroup::"; fi
          if [ "$RC_FAST" -ne 0 ] || [ "$RC_PDF" -ne 0 ]; then
            echo "Tests failed (fast=$RC_FAST pdf=$RC_PDF)"
            exit 1
          fi

      - name: Cache Trivy Vulnerability DB
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/trivy
          key: ${{ runner.os }}-trivy-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-trivy-

      # Scan the locally loaded image — no registry pull needed, and this
      # gates the push so only clean images reach GHCR.
      - name: Security scan – trivy (image)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: app:ci
          format: table
          exit-code: 1
          severity: CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore

      # Tests and scan both passed — retag app:ci with all computed tags and push.
      - name: Push to GHCR
        run: |
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker tag app:ci "$tag"
            docker push "$tag"
          done <<< "${{ steps.docker_meta.outputs.tags }}"

      # ── Deploy to Heroku ────────────────────────────────────────────────
      - name: Log in to Heroku registry
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.HEROKU_API_KEY }}" | \
            docker login registry.heroku.com --username=_ --password-stdin

      # Retag from the locally loaded app:ci — no docker pull from GHCR needed.
      - name: Tag and push to Heroku registry
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        id: heroku_push
        run: |
          docker tag app:ci registry.heroku.com/${{ secrets.HEROKU_APP_NAME }}/web
          docker push registry.heroku.com/${{ secrets.HEROKU_APP_NAME }}/web
          IMAGE_ID=$(docker inspect registry.heroku.com/${{ secrets.HEROKU_APP_NAME }}/web --format='{{.Id}}')
          echo "image_id=$IMAGE_ID" >> $GITHUB_OUTPUT

      - name: Release to Heroku
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          curl -fsS -X PATCH \
            "https://api.heroku.com/apps/${{ secrets.HEROKU_APP_NAME }}/formation" \
            -H "Content-Type: application/json" \
            -H "Accept: application/vnd.heroku+json; version=3.docker-releases" \
            -H "Authorization: Bearer ${{ secrets.HEROKU_API_KEY }}" \
            -d "{\"updates\":[{\"type\":\"web\",\"docker_image\":\"${{ steps.heroku_push.outputs.image_id }}\"}]}"

      # ── Auto-tag & release on version bump ───────────────────────────────
      - name: Tag and release new version
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_VERSION: ${{ steps.meta-vars.outputs.APP_VERSION }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v${APP_VERSION}" > /dev/null 2>&1; then
            echo "Tag v${APP_VERSION} already exists, skipping release."
          else
            git tag "v${APP_VERSION}"
            git push origin "v${APP_VERSION}"
            gh release create "v${APP_VERSION}" --generate-notes --title "v${APP_VERSION}"
          fi

      # ── Auto-bump patch version for next release ─────────────────────────
      # Runs after the release so the current version is tagged first.
      # Requires VERSION_BUMP_TOKEN (fine-grained PAT, Contents read+write).
      # GITHUB_TOKEN authenticates as github-actions[bot], which cannot bypass
      # the required-PR branch protection on main. A PAT authenticates as the
      # repo owner (admin), who can bypass since enforce_admins=false.
      # [skip ci] prevents the PAT push from re-triggering this workflow.
      - name: Bump patch version
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.VERSION_BUMP_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::VERSION_BUMP_TOKEN secret not set — skipping version bump." \
              "Create a fine-grained PAT (Contents: read+write) and add it as a repo secret."
            exit 0
          fi
          CURRENT=${{ steps.meta-vars.outputs.APP_VERSION }}
          MAJOR=$(echo "$CURRENT" | cut -d. -f1)
          MINOR=$(echo "$CURRENT" | cut -d. -f2)
          PATCH=$(echo "$CURRENT" | cut -d. -f3)
          NEW="${MAJOR}.${MINOR}.$((PATCH + 1))"
          sed -i "s/__version__ = [\"']${CURRENT}[\"']/__version__ = \"${NEW}\"/" app/__init__.py
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull
          git add app/__init__.py
          git commit -m "chore: bump version ${CURRENT} → ${NEW} [skip ci]"
          BUMP_BRANCH="auto-bump-v${NEW}"
          git remote set-url origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}"
          git checkout -b "$BUMP_BRANCH"
          git push origin "$BUMP_BRANCH"
          gh pr create \
            --title "chore: bump version ${CURRENT} → ${NEW} [skip ci]" \
            --body "Automated patch version bump." \
            --base main --head "$BUMP_BRANCH"
          gh pr merge "$BUMP_BRANCH" --admin --merge
          git push origin --delete "$BUMP_BRANCH" || true

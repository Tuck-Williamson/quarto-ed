name: Build, Test, and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # Single job: build → test inside the image → push → deploy.
  # Tests always run against the exact image that ships to production.
  build-test-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute build metadata (version, short SHA)
        run: |
          echo "SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)" >> $GITHUB_ENV
          APP_VERSION=$(python3 -c "import re; print(re.search(r'__version__\s*=\s*[\"\x27]([^\"\x27]+)[\"\x27]', open('app/__init__.py').read()).group(1))")
          echo "APP_VERSION=$APP_VERSION" >> $GITHUB_ENV

      - name: Lowercase image name
        run: |
          echo "GHCR_IMAGE=$(echo '${{ env.GHCR_IMAGE }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Static security scans (fast, run on host before Docker build) ──
      - name: Security scan – pip-audit
        run: pip install pip-audit && pip-audit -r requirements.txt

      - name: Security scan – bandit
        run: pip install bandit && bandit -r app/ -c .bandit -ll

      # ── Build production image ──────────────────────────────────────────
      # load: true puts the image in the local Docker daemon for testing.
      # We push manually after tests pass.
      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: app:ci
          build-args: |
            GIT_SHA=${{ env.SHORT_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Image vulnerability scan (runs against the built image) ────────
      - name: Security scan – trivy (image)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: app:ci
          format: table
          exit-code: 1
          severity: CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore

      # ── Run test suite inside the production image ──────────────────────
      - name: Build test image (extends production + pytest deps)
        run: |
          docker build \
            --build-arg BASE_IMAGE=app:ci \
            -f Dockerfile.test \
            -t app:test \
            .

      - name: Run tests
        run: docker run --rm app:test

      # ── Push production image (tests must pass first) ───────────────────
      - name: Push production image to ghcr.io
        if: github.event_name != 'pull_request'
        run: |
          docker tag app:ci "$GHCR_IMAGE:latest"
          docker tag app:ci "$GHCR_IMAGE:sha-${SHORT_SHA}"
          docker tag app:ci "$GHCR_IMAGE:v${APP_VERSION}"
          docker push "$GHCR_IMAGE:latest"
          docker push "$GHCR_IMAGE:sha-${SHORT_SHA}"
          docker push "$GHCR_IMAGE:v${APP_VERSION}"

      # ── Push PR image with PR number tag (for Heroku review apps) ────────
      - name: Log in to ghcr.io (PR builds)
        if: github.event_name == 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push PR image to ghcr.io with PR tag
        if: github.event_name == 'pull_request'
        run: |
          docker tag app:ci "$GHCR_IMAGE:pr-${{ github.event.number }}"
          docker tag app:ci "$GHCR_IMAGE:sha-${SHORT_SHA}"
          docker push "$GHCR_IMAGE:pr-${{ github.event.number }}"
          docker push "$GHCR_IMAGE:sha-${SHORT_SHA}"

      - name: Log in to Heroku registry (PR builds)
        if: github.event_name == 'pull_request'
        run: |
          echo "${{ secrets.HEROKU_API_KEY }}" | \
            docker login registry.heroku.com --username=_ --password-stdin

      - name: Push PR image to Heroku registry
        if: github.event_name == 'pull_request'
        id: heroku_pr_push
        run: |
          docker tag app:ci registry.heroku.com/${{ secrets.HEROKU_APP_NAME }}/web:pr-${{ github.event.number }}
          docker push registry.heroku.com/${{ secrets.HEROKU_APP_NAME }}/web:pr-${{ github.event.number }}

      # ── Deploy to Heroku ────────────────────────────────────────────────
      - name: Log in to Heroku registry
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.HEROKU_API_KEY }}" | \
            docker login registry.heroku.com --username=_ --password-stdin

      - name: Tag and push to Heroku registry
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        id: heroku_push
        run: |
          docker tag app:ci registry.heroku.com/${{ secrets.HEROKU_APP_NAME }}/web
          docker push registry.heroku.com/${{ secrets.HEROKU_APP_NAME }}/web
          IMAGE_ID=$(docker inspect registry.heroku.com/${{ secrets.HEROKU_APP_NAME }}/web --format='{{.Id}}')
          echo "image_id=$IMAGE_ID" >> $GITHUB_OUTPUT

      - name: Release to Heroku
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          curl -fsS -X PATCH \
            "https://api.heroku.com/apps/${{ secrets.HEROKU_APP_NAME }}/formation" \
            -H "Content-Type: application/json" \
            -H "Accept: application/vnd.heroku+json; version=3.docker-releases" \
            -H "Authorization: Bearer ${{ secrets.HEROKU_API_KEY }}" \
            -d "{\"updates\":[{\"type\":\"web\",\"docker_image\":\"${{ steps.heroku_push.outputs.image_id }}\"}]}"

      # ── Auto-tag & release on version bump ───────────────────────────────
      - name: Tag and release new version
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v${APP_VERSION}" > /dev/null 2>&1; then
            echo "Tag v${APP_VERSION} already exists, skipping release."
          else
            git tag "v${APP_VERSION}"
            git push origin "v${APP_VERSION}"
            gh release create "v${APP_VERSION}" --generate-notes --title "v${APP_VERSION}"
          fi

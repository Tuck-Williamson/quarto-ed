name: Build and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository }}
  QUARTO_VERSION: "1.7.32"

jobs:
  # ── Test job ───────────────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Quarto
        run: |
          wget -q "https://github.com/quarto-dev/quarto-cli/releases/download/v${QUARTO_VERSION}/quarto-${QUARTO_VERSION}-linux-amd64.deb" -O /tmp/quarto.deb
          sudo dpkg -i /tmp/quarto.deb

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4"
          use-public-rspm: true

      - name: Install R packages
        run: Rscript -e "install.packages(c('knitr', 'rmarkdown'))"

      - name: Install Python dependencies
        run: pip install -r requirements.txt -r requirements-test.txt

      - name: Run tests
        run: pytest --tb=short -q

  # ── Build and deploy job ───────────────────────────────────────────────────
  build-and-deploy:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lowercase image name
        run: echo "GHCR_IMAGE=$(echo '${{ env.GHCR_IMAGE }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GHCR_IMAGE }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push to ghcr.io
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Log in to Heroku registry
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.HEROKU_API_KEY }}" | \
            docker login registry.heroku.com --username=_ --password-stdin

      - name: Tag and push to Heroku registry
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        id: heroku_push
        run: |
          docker pull ${{ env.GHCR_IMAGE }}:latest
          docker tag  ${{ env.GHCR_IMAGE }}:latest \
                      registry.heroku.com/${{ secrets.HEROKU_APP_NAME }}/web
          docker push registry.heroku.com/${{ secrets.HEROKU_APP_NAME }}/web
          IMAGE_ID=$(docker inspect registry.heroku.com/${{ secrets.HEROKU_APP_NAME }}/web --format='{{.Id}}')
          echo "image_id=$IMAGE_ID" >> $GITHUB_OUTPUT

      - name: Release to Heroku
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          curl -fsS -X PATCH \
            "https://api.heroku.com/apps/${{ secrets.HEROKU_APP_NAME }}/formation" \
            -H "Content-Type: application/json" \
            -H "Accept: application/vnd.heroku+json; version=3.docker-releases" \
            -H "Authorization: Bearer ${{ secrets.HEROKU_API_KEY }}" \
            -d "{\"updates\":[{\"type\":\"web\",\"docker_image\":\"${{ steps.heroku_push.outputs.image_id }}\"}]}"

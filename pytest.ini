[pytest]
asyncio_mode = auto
testpaths = tests
# Exclude the slow PDF suite by default. The dedicated PDF container overrides
# this with an explicit `-m pdf` on the command line (last -m wins in pytest).
addopts = --cov=app --cov-report=term-missing -m "not pdf"
markers =
    pdf: slow TinyTeX PDF renders; excluded by default, run locally and on main-branch CI (needs RUN_PDF_TESTS=1)

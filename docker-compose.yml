services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: quartoed
      POSTGRES_PASSWORD: quartoed
      POSTGRES_DB: quartoed
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  auth:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      PORT: "8000"
      DATABASE_URL: postgresql+asyncpg://quartoed:quartoed@db:5432/quartoed
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      SECRET_KEY: ${SECRET_KEY}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY}
      EDITOR_SERVICE_URL: http://editor:8001
      INTERNAL_TOKEN: dev-internal-token
    depends_on:
      - db
      - editor

  editor:
    build:
      context: .
      dockerfile: Dockerfile.editor
    ports:
      - "8001:8001"
    environment:
      PORT: "8001"
      DATABASE_URL: postgresql+asyncpg://quartoed:quartoed@db:5432/quartoed
      SECRET_KEY: ${SECRET_KEY}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY}
      INTERNAL_TOKEN: dev-internal-token
    depends_on:
      - db
    volumes:
      - workspace_data:/workspace

volumes:
  pg_data:
  workspace_data:
